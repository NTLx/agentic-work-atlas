name: Deploy Agentic Work Atlas to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Agentic Work Atlas content
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: atlas

      - name: Checkout Quartz
        uses: actions/checkout@v5
        with:
          repository: jackyzha0/quartz
          ref: d25a6eabf96751ffca56f8a8139272def7a65041
          path: quartz

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          working-directory: atlas

      - name: Run Wiki Lint (gate)
        working-directory: atlas
        run: |
          uv sync

          # 只读校验：以本 commit 的提交日期作为时间基准（as-of），
          # 同一 commit 无论哪天重跑，stale-core 等检查结果恒定。
          # lint-report 为派生审计产物，CI 不生成、不提交、不比对。
          AS_OF=$(git show -s --format=%cs HEAD)

          uv run python tools/wiki-lint.py --as-of "$AS_OF"

      - name: Run Tests
        working-directory: atlas
        run: uv run --with pytest pytest -q

      - name: Install Quartz Dependencies
        working-directory: quartz
        run: npm ci

      - name: Setup Quartz Configuration
        run: |
          cp atlas/quartz.config.ts quartz/
          cp atlas/quartz.layout.ts quartz/
          if [ -d atlas/quartz-overrides/styles ]; then
            cp atlas/quartz-overrides/styles/*.scss quartz/quartz/styles/
          fi

      - name: Build Quartz (方案 C：直接使用仓库根目录)
        working-directory: quartz
        run: |
          npx quartz build -d ../atlas

          # Publication boundary:
          # Quartz public 只能包含正式公开知识面，
          # 不能泄露 Raw Evidence、Schema、运行状态、Agent Runtime 或研究日志。
          test -f public/index.html

          for path in \
            public/raw \
            public/schema \
            public/state \
            public/tools \
            public/.agents \
            public/.claude \
            public/wiki/research/research-logs
          do
            if [ -e "$path" ]; then
              echo "::error::Publication boundary violation: $path was emitted by Quartz"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
